# Runs the knowledge base checker. Copy into your repo's .github/workflows/.
#
# During adoption both runs use --allow-placeholders: leftover placeholders and stale docs
# show up as warnings in the log and the run stays green.
# Once the template is filled in:
#   1. PR run:        remove --allow-placeholders
#   2. Scheduled run: replace --allow-placeholders with --strict, so stale docs fail the build
#
# Gitflow note: GitHub runs scheduled workflows on the default branch. The current KB lives
# on develop (main only holds the last release), so the scheduled run switches to develop
# when that branch exists.
name: kb-check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "kb/**"
      - ".github/workflows/kb-check.yml"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — catches docs that went stale without a PR
  workflow_dispatch:

jobs:
  kb-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch to develop (scheduled run only)
        if: github.event_name == 'schedule'
        run: |
          if git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            git fetch --depth 1 origin develop
            git checkout --detach FETCH_HEAD
            echo "Checking the develop branch."
          else
            echo "No develop branch found; checking the default branch."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the checker
        run: python3 -m unittest discover -s kb/_tools -p 'test_*.py'
      - name: Check knowledge base (pull request / manual)
        if: github.event_name != 'schedule'
        run: python3 kb/_tools/kb_check.py --allow-placeholders
      - name: Check knowledge base (scheduled — staleness)
        if: github.event_name == 'schedule'
        run: python3 kb/_tools/kb_check.py --allow-placeholders
